# ==============================================================================
# SITE DECLARATION: BRANCH 1 (CHICAGO)
# ==============================================================================
# Maps the dual Catalyst C8235-G2 secure routers for Chicago.
# Configured with VRRP on service interfaces and OSPF peerings to local border switches.
# ==============================================================================
---
sites:
  - site_id: 101
    name: "Chicago_Branch"
    configuration_group: "Branch_Medium_Group"
    devices:
      # ========================================================================
      # Branch 1 - Router 1 (Master)
      # ========================================================================
      - hostname: "br101-c8235-1"
        device_model: "C8235-G2"
        serial_number: "C-8235-101A"
        system_ip: "172.16.255.101" # Unique logical loopback ID
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.101.11/24"
          vpn512_mgmt_gateway: "192.168.101.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.101/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.101/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing Protocol - OSPF parameters
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.101.10.2/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 110 # Active Master
          vpn10_vrrp_vip: "10.101.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.101.20.2/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 110
          vpn20_vrrp_vip: "10.101.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.101.30.2/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 110
          vpn30_vrrp_vip: "10.101.30.1"

      # ========================================================================
      # Branch 1 - Router 2 (Backup)
      # ========================================================================
      - hostname: "br101-c8235-2"
        device_model: "C8235-G2"
        serial_number: "C-8235-101B"
        system_ip: "172.16.255.102" # Unique logical loopback ID
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.101.12/24"
          vpn512_mgmt_gateway: "192.168.101.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.102/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.102/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing Protocol - OSPF parameters
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.101.10.3/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 100 # Hot Standby Backup
          vpn10_vrrp_vip: "10.101.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.101.20.3/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 100
          vpn20_vrrp_vip: "10.101.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.101.30.3/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 100
          vpn30_vrrp_vip: "10.101.30.1"
