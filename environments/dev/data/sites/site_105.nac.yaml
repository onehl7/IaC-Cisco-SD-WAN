# ==============================================================================
# SITE DECLARATION: BRANCH 5 (SAN JOSE)
# ==============================================================================
# Maps the dual Catalyst C8475-G2 secure routers for San Jose.
# Configured with VRRP on service interfaces and OSPF peerings to local border switches.
# ==============================================================================
---
sites:
  - site_id: 105
    name: "San_Jose_Branch"
    configuration_group: "Branch_XLarge_Group"
    devices:
      # ========================================================================
      # Branch 5 - Router 1 (Master)
      # ========================================================================
      - hostname: "br105-c8475-1"
        device_model: "C8475-G2"
        serial_number: "C-8475-105A"
        system_ip: "172.16.255.109"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.105.11/24"
          vpn512_mgmt_gateway: "192.168.105.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.109/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.109/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.105.10.2/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 110
          vpn10_vrrp_vip: "10.105.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.105.20.2/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 110
          vpn20_vrrp_vip: "10.105.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.105.30.2/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 110
          vpn30_vrrp_vip: "10.105.30.1"

      # ========================================================================
      # Branch 5 - Router 2 (Backup)
      # ========================================================================
      - hostname: "br105-c8475-2"
        device_model: "C8475-G2"
        serial_number: "C-8475-105B"
        system_ip: "172.16.255.110"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.105.12/24"
          vpn512_mgmt_gateway: "192.168.105.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.110/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.110/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.105.10.3/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 100
          vpn10_vrrp_vip: "10.105.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.105.20.3/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 100
          vpn20_vrrp_vip: "10.105.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.105.30.3/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 100
          vpn30_vrrp_vip: "10.105.30.1"
