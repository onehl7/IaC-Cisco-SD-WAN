# ==============================================================================
# SITE DECLARATION: BRANCH 4 (NEW YORK)
# ==============================================================================
# Maps the dual Catalyst C8355-G2 secure routers for New York.
# Configured with VRRP on service interfaces and OSPF peerings to local border switches.
# ==============================================================================
---
sites:
  - site_id: 104
    name: "New_York_Branch"
    configuration_group: "Branch_Large_Group"
    devices:
      # ========================================================================
      # Branch 4 - Router 1 (Master)
      # ========================================================================
      - hostname: "br104-c8355-1"
        device_model: "C8355-G2"
        serial_number: "C-8355-104A"
        system_ip: "172.16.255.107"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.104.11/24"
          vpn512_mgmt_gateway: "192.168.104.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.107/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.107/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.104.10.2/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 110
          vpn10_vrrp_vip: "10.104.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.104.20.2/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 110
          vpn20_vrrp_vip: "10.104.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.104.30.2/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 110
          vpn30_vrrp_vip: "10.104.30.1"

      # ========================================================================
      # Branch 4 - Router 2 (Backup)
      # ========================================================================
      - hostname: "br104-c8355-2"
        device_model: "C8355-G2"
        serial_number: "C-8355-104B"
        system_ip: "172.16.255.108"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.104.12/24"
          vpn512_mgmt_gateway: "192.168.104.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.108/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.108/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.104.10.3/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 100
          vpn10_vrrp_vip: "10.104.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.104.20.3/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 100
          vpn20_vrrp_vip: "10.104.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.104.30.3/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 100
          vpn30_vrrp_vip: "10.104.30.1"
