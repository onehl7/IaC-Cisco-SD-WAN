# ==============================================================================
# SITE DECLARATION: BRANCH 3 (DALLAS)
# ==============================================================================
# Maps the dual Catalyst C8355-G2 secure routers for Dallas.
# Configured with VRRP on service interfaces and OSPF peerings to local border switches.
# ==============================================================================
---
sites:
  - site_id: 103
    name: "Dallas_Branch"
    configuration_group: "Branch_Large_Group"
    devices:
      # ========================================================================
      # Branch 3 - Router 1 (Master)
      # ========================================================================
      - hostname: "br103-c8355-1"
        device_model: "C8355-G2"
        serial_number: "C-8355-103A"
        system_ip: "172.16.255.105"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.103.11/24"
          vpn512_mgmt_gateway: "192.168.103.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.105/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.105/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.103.10.2/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 110
          vpn10_vrrp_vip: "10.103.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.103.20.2/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 110
          vpn20_vrrp_vip: "10.103.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.103.30.2/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 110
          vpn30_vrrp_vip: "10.103.30.1"

      # ========================================================================
      # Branch 3 - Router 2 (Backup)
      # ========================================================================
      - hostname: "br103-c8355-2"
        device_model: "C8355-G2"
        serial_number: "C-8355-103B"
        system_ip: "172.16.255.106"
        variables:
          # Out-of-Band (VPN 512)
          vpn512_mgmt_ip: "192.168.103.12/24"
          vpn512_mgmt_gateway: "192.168.103.1"
          
          # WAN Transport (VPN 0)
          vpn0_ge1_ip: "192.0.2.106/24"
          vpn0_ge1_gateway: "192.0.2.1"
          vpn0_ge2_ip: "198.51.100.106/24"
          vpn0_ge2_gateway: "198.51.100.1"
          
          # LAN Routing
          ospf_area: "0.0.0.0"
          
          # Corp Segment (VPN 10)
          vpn10_lan_ip: "10.103.10.3/24"
          vpn10_vrrp_group: 10
          vpn10_vrrp_priority: 100
          vpn10_vrrp_vip: "10.103.10.1"
          
          # Guest Segment (VPN 20)
          vpn20_lan_ip: "10.103.20.3/24"
          vpn20_vrrp_group: 20
          vpn20_vrrp_priority: 100
          vpn20_vrrp_vip: "10.103.20.1"
          
          # IoT Segment (VPN 30)
          vpn30_lan_ip: "10.103.30.3/24"
          vpn30_vrrp_group: 30
          vpn30_vrrp_priority: 100
          vpn30_vrrp_vip: "10.103.30.1"
