# ==============================================================================
# CONFIGURATION GROUP: DATA CENTER CLUSTER
# ==============================================================================
# Binds profiles together for our Catalyst C8500 DC Routers.
# Uses the BGP-enabled LAN Service profile.
# ==============================================================================
---
sdwan:
  configuration_groups:
    - name: "DC_Cluster_Group"
      description: "Configuration Group for Datacenter Core/WAN Edge Aggregation Routers"
      system_profile: "System_Base_Profile"
      transport_profile: "Transport_WAN_Profile"
      service_profile: "Service_DC_LAN_Profile"

