# ==============================================================================
# CONFIGURATION GROUP: BRANCH XLARGE
# ==============================================================================
# Binds profiles together for our Catalyst C8475-G2 branch routers.
# Uses the OSPF-enabled LAN Service profile.
# ==============================================================================
---
sdwan:
  configuration_groups:
    - name: "Branch_XLarge_Group"
      description: "Configuration Group for Aggregation/XL Sites (Catalyst C8475-G2 Routers)"
      system_profile: "System_Base_Profile"
      transport_profile: "Transport_WAN_Profile"
      service_profile: "Service_Branch_LAN_Profile"

