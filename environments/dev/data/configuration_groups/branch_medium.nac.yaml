# ==============================================================================
# CONFIGURATION GROUP: BRANCH MEDIUM
# ==============================================================================
# Binds profiles together for our Catalyst C8235-G2 branch routers.
# Uses the OSPF-enabled LAN Service profile.
# ==============================================================================
---
sdwan:
  configuration_groups:
    - name: "Branch_Medium_Group"
      description: "Configuration Group for Medium Sites (Catalyst C8235-G2 Routers)"
      profiles:
        - name: "System_Base_Profile"
        - name: "Transport_WAN_Profile"
        - name: "Management_OOB_Profile"
        - name: "Service_Branch_LAN_Profile"
