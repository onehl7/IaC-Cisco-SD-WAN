# ==============================================================================
# SYSTEM FEATURE PROFILE
# ==============================================================================
# Configures global device parameters such as timezone and loopback interfaces.
# System IP and Hostname are mapped dynamically from site definitions.
# ==============================================================================
---
sdwan:
  feature_profiles:
    system_profiles:
      - name: "System_Base_Profile"
        description: "Standard System Configuration for Catalyst 8000 Routers"
        
        # Use UTC timezone for standardized logs
        timezone: "UTC"
        
        # Admin AAA local user definition
        aaa:
          name: "aaa"
          users:
            - name: "admin"
              role: "admin"
          
      # Loopback tracking features can be added here
