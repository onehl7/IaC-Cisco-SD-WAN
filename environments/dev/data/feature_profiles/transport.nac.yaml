# ==============================================================================
# TRANSPORT FEATURE PROFILE (VPN 0) - INSTRUCTIONAL TEMPLATE
# ==============================================================================
# Configures external-facing WAN links, tunnel interfaces, and underlay routing.
# These physical interfaces terminate MPLS and Business Internet tunnels.
#
# CUSTOMIZATION GUIDELINE:
# - The interface names ("GigabitEthernet1", "GigabitEthernet2") are mapped to
#   physical ports on the Catalyst 8000 series routers (e.g. C8235, C8355, C8475, C8500).
#   Update these names if your hardware topology uses different port layouts.
# - Next-hops and IP variables (e.g., "vpn0_ge1_ip", "vpn0_ge1_gateway") are placeholders
#   that must be defined per-device in the site YAML files (under data/sites/).
# - Colors ("mpls", "biz-internet") determine the carrier path type and are used
#   by App-Aware Routing (AAR) policies to select active paths.
# ==============================================================================
---
sdwan:
  feature_profiles:
    transport_profiles:
      - name: "Transport_WAN_Profile"
        description: "Transport configuration for Dual-WAN Uplinks (MPLS and Biz Internet)"
        
        wan_vpn:
          name: "wan_vpn"
          
          # Static default route allocations for the WAN carrier networks.
          # Note: Next-hop values are dynamically resolved per-router from the site files.
          # Subject to change based on carrier static routing requirements.
          static_routes:
            - prefix: "0.0.0.0/0"
              next_hop: "vpn0_ge1_gateway" # Resolved from site-specific values (e.g. MPLS gateway)
            - prefix: "0.0.0.0/0"
              next_hop: "vpn0_ge2_gateway" # Resolved from site-specific values (e.g. Internet gateway)

          ethernet_interfaces:
            # --- MPLS WAN Interface ---
            # Configures WAN Tunnel terminating the Private MPLS circuit.
            # IP Address is dynamically assigned per-router from site variables.
            - name: "GigabitEthernet1"
              description: "WAN Uplink - MPLS Provider"
              ip_address: "vpn0_ge1_ip" # Reference variable mapped in site files
              tunnel_interface:
                color: "mpls"
                encapsulation: "ipsec"
                allow_service:
                  - "dns"
                  - "ntp"
                  - "netconf"

            # --- Business Internet WAN Interface ---
            # Configures WAN Tunnel terminating the Public Internet circuit.
            # IP Address is dynamically assigned per-router from site variables.
            - name: "GigabitEthernet2"
              description: "WAN Uplink - Business Internet"
              ip_address: "vpn0_ge2_ip" # Reference variable mapped in site files
              tunnel_interface:
                color: "biz-internet"
                encapsulation: "ipsec"
                allow_service:
                  - "dhcp"
                  - "dns"
                  - "ntp"
                  - "netconf"
