# ==============================================================================
# MANAGEMENT FEATURE PROFILE (VPN 512) - INSTRUCTIONAL TEMPLATE
# ==============================================================================
# Configures the isolated Out-of-Band (OOB) management interface.
# By default, all management traffic (SSH/HTTPS) is routed through this VRF.
#
# CUSTOMIZATION GUIDELINE:
# - VPN 512 is reserved strictly for local isolated Out-of-Band (OOB) management.
# - GigabitEthernet0 is the standard dedicated management port on Catalyst 8000 devices.
#   If your virtual CML nodes or specific hardware models use a different interface name 
#   for management (e.g. FastEthernet0 or Management0), modify the "name" field below.
# - Next-hop and IP variables (e.g., "vpn512_mgmt_ip", "vpn512_mgmt_gateway") are mapped
#   to site-specific files to allow each device to have its own unique management IP.
# - Modify these variables in the site configuration files to match your local management subnets.
# ==============================================================================
---
sdwan:
  feature_profiles:
    transport_profiles:
      - name: "Management_OOB_Profile"
        description: "Out-Of-Band Management configuration for VPN 512"
        
        management_vpn:
          name: "management_vpn"
          
          # Default gateway routing inside the management VRF (VPN 512).
          # Directs OOB traffic back to your management switches.
          static_routes:
            - prefix: "0.0.0.0/0"
              next_hop: "vpn512_mgmt_gateway" # Resolved from site-specific variables
              
          ethernet_interfaces:
            - name: "GigabitEthernet0" # Standard OOB management interface on Catalyst 8000
              description: "OOB LAN Management Connection"
              ip_address: "vpn512_mgmt_ip" # Resolved from site-specific variables
