# ==============================================================================
# GLOBAL FABRIC BASELINE DEFAULTS
# ==============================================================================
# NOTE: The values below are global configurations applied as default backups
# for all devices. These values are subject to change based on enterprise policy.
# ==============================================================================
---
defaults:
  # Cisco Catalyst SD-WAN Fabric Identification
  organization_name: "Enterprise-SDWAN-Dev"
  vbond_address: "192.0.2.5" # Public or DMZ IP address of the vBond Orchestrator
  overlay_id: 1

  # Global System Parameter Baselines
  timezone: "UTC"

  # Domain Name System (DNS) Servers
  # Primary and secondary resolvers used by standard routing templates.
  # Adjust according to local branch ISP and datacenter internal DNS requirements.
  dns_servers:
    - "8.8.8.8" # Google Public DNS (Primary - placeholder)
    - "1.1.1.1" # Cloudflare Public DNS (Secondary - placeholder)

  # Network Time Protocol (NTP) Servers
  # Synchronizes clocks across the entire SD-WAN fabric.
  # Crucial for PKI certificate verification and DTLS handshakes.
  ntp_servers:
    - "time.google.com" # NTP Source 1 (Subject to change)
    - "pool.ntp.org"    # NTP Source 2 (Subject to change)
